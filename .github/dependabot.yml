version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      drift:
        patterns: ["drift*", "sqlite3*"]
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: monthly

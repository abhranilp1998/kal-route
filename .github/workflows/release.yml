name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v1.1.0
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  JAVA_VERSION: "21" # AGP 9.x lint needs a JDK 21 runtime; bytecode still targets 17
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

defaults:
  run:
    working-directory: app

jobs:
  android:
    name: Signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Derive versionName / versionCode from tag
        id: ver
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like vMAJOR.MINOR.PATCH"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then echo "::error::minor/patch must be <= 99"; exit 1; fi
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "versionName=${major}.${minor}.${patch} versionCode=${code}"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.KAL_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::KAL_UPLOAD_KEYSTORE_BASE64 secret is missing"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KAL_ROUTE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build release APK and AAB
        env:
          KAL_ROUTE_REQUIRE_RELEASE_SIGNING: "true"
          KAL_ROUTE_KEYSTORE_PASSWORD: ${{ secrets.KAL_UPLOAD_STORE_PASSWORD }}
          KAL_ROUTE_KEY_ALIAS: ${{ secrets.KAL_UPLOAD_KEY_ALIAS }}
          KAL_ROUTE_KEY_PASSWORD: ${{ secrets.KAL_UPLOAD_KEY_PASSWORD }}
          MAPS_KEY: ${{ secrets.MAPS_KEY }}
          BUILD_NAME: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.code }}
        run: |
          args=(--release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER")
          if [ -n "$MAPS_KEY" ]; then
            echo "MAPS_KEY secret present: passing it via --dart-define"
            args+=(--dart-define=MAPS_KEY="$MAPS_KEY")
          else
            echo "No MAPS_KEY secret: building with keyless OSM/OSRM routing"
          fi
          flutter build apk "${args[@]}"
          flutter build appbundle "${args[@]}"
      - name: Verify signature and version
        env:
          BUILD_NAME: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.code }}
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$bt/apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          "$bt/aapt2" dump badging "$apk" | head -1 | tee /tmp/badging.txt
          grep -q "versionCode='$BUILD_NUMBER'" /tmp/badging.txt
          grep -q "versionName='$BUILD_NAME'" /tmp/badging.txt
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | tail -1
      - name: Collect assets + checksums
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/dist/kal-route-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dist/kal-route-$TAG.aab"
          cd "$RUNNER_TEMP/dist" && sha256sum kal-route-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  web:
    name: Web build for Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: flutter build web
        env:
          MAPS_KEY: ${{ secrets.MAPS_KEY }}
        run: |
          args=(--release --base-href "/${GITHUB_REPOSITORY#*/}/")
          [ -n "$MAPS_KEY" ] && args+=(--dart-define=MAPS_KEY="$MAPS_KEY")
          flutter build web "${args[@]}"
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/build/web

  github-release:
    name: GitHub Release
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-android
          path: dist
      - name: Create or update release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" kal-route-* SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" kal-route-* SHA256SUMS.txt \
              --verify-tag --generate-notes --title "Kal Route $TAG"
          fi

  pages:
    name: Deploy to GitHub Pages
    needs: [web, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
